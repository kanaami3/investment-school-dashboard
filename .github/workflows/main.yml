name: Build and Deploy Dashboard

on:
  schedule:
    - cron: '30 22 * * 0-4'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r web-dashboard/requirements.txt
      - name: Generate data
        env:
          TZ: Asia/Tokyo
        run: |
          cd web-dashboard
          python scripts/update.py
      - name: Commit data refresh
        run: |
          git config user.name "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add web-dashboard/data/
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh data $(date -u +'%Y-%m-%d %H:%MZ')"
            git pull --rebase origin main || true
            git push || echo "push failed (data may be already current)"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web-dashboard

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
